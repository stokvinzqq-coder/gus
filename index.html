<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Teman Lucu 😆</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(180deg, #ffd6e8, #ffeaa7);
      text-align: center;
      padding: 20px;
      color: #333;
    }
    h1 {
      font-size: 24px;
      color: #ff4081;
      text-shadow: 2px 2px #fff;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    input[type=file] {
      background: #ff80ab;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: white;
      border-radius: 15px;
      width: 130px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      overflow: hidden;
      transition: transform 0.3s;
    }
    .card:hover { transform: rotate(3deg) scale(1.05); }
    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
    }
    .caption {
      padding: 6px;
      background: #ffe4ec;
      color: #444;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>😆 Galeri Teman Lucu 😆</h1>
  <input type="file" id="fileInput" accept="image/*" multiple>
  <div class="gallery" id="gallery"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const gallery = document.getElementById('gallery');

    const jokes = [
      'Lagi mikirin tugas 😭',
      'Si paling mager 💤',
      'Udah ngopi tapi masih ngantuk ☕',
      'Senyum tapi hati remuk 💔',
      'Laper tapi mager ke dapur 🍜',
      'Mode ngambek on 😡',
      'Baru bangun jam segini 😴',
      'Ngantuknya level dewa 😵',
      'Nunggu balasan chat... ga dibales 😢',
      'Cie yang lagi senyum liat foto ini 😏'
    ];

    fileInput.addEventListener('change', e => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          const card = document.createElement('div');
          card.className = 'card';
          const img = document.createElement('img');
          img.src = reader.result;
          const caption = document.createElement('div');
          caption.className = 'caption';
          caption.textContent = jokes[Math.floor(Math.random() * jokes.length)];
          card.appendChild(img);
          card.appendChild(caption);
          gallery.appendChild(card);
        };
        reader.readAsDataURL(file);
      });
    });
  </script>

</body>
</html>
